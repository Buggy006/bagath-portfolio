name: Build & Deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/waitlist/requirements-dev.txt
      - run: python -m pytest backend/waitlist -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out/
          retention-days: 7

  deploy:
    # Deploys only from master, and only once AWS secrets are configured
    # (see infra/README.md). Until then the job is skipped, not failed.
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check AWS secrets
        id: creds
        run: echo "configured=${{ secrets.AWS_ACCESS_KEY_ID != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: steps.creds.outputs.configured == 'true'
        with:
          name: site
          path: out

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.creds.outputs.configured == 'true'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync to S3
        if: steps.creds.outputs.configured == 'true'
        run: aws s3 sync out/ "s3://${{ secrets.S3_BUCKET }}" --delete

      - name: Invalidate CloudFront
        if: steps.creds.outputs.configured == 'true'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
